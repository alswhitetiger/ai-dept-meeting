<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 부서 회의</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #6ea8fe;
      --accent-2: #8b5cf6;
      --ok: #34d399;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(110,168,254,.08), rgba(139,92,246,.08));
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; }

    .composer {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 8px; padding: 16px 0;
      background: linear-gradient(var(--bg), var(--bg) 70%, transparent);
    }
    .composer input {
      flex: 1; padding: 14px 16px; font-size: 15px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer button {
      padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #0b1220; border: none; border-radius: 12px;
      transition: opacity .15s;
    }
    .composer button:disabled { opacity: .5; cursor: not-allowed; }

    .hint { color: var(--muted); font-size: 13px; margin: 4px 2px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
    .chip {
      font-size: 12.5px; color: var(--muted); cursor: pointer;
      background: var(--panel); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 999px;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }

    .phase {
      display: flex; align-items: center; gap: 10px;
      margin: 26px 0 14px; color: var(--muted); font-size: 13px; font-weight: 600;
      letter-spacing: .02em;
    }
    .phase::before, .phase::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    .bubble {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px; margin: 10px 0;
      animation: pop .18s ease;
    }
    @keyframes pop { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }
    .bubble.final { background: var(--panel-2); border-color: var(--accent-2); }
    .bhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: #0e1220; border: 1px solid var(--border); font-size: 17px;
    }
    .bname { font-weight: 700; font-size: 14px; }
    .brole {
      font-size: 11px; color: var(--muted); border: 1px solid var(--border);
      padding: 1px 7px; border-radius: 999px;
    }
    .btext { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
    .btext.md h2 { font-size: 16px; margin: 14px 0 6px; }
    .btext.md strong { color: #fff; }
    .btext.md ul { margin: 6px 0; padding-left: 20px; }

    .cursor::after {
      content: "▋"; color: var(--accent); animation: blink 1s steps(2) infinite;
      margin-left: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .status { text-align: center; color: var(--muted); font-size: 13px; margin: 20px 0; }
    .error {
      background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.4);
      color: #fda4af; padding: 12px 14px; border-radius: 12px; margin: 12px 0; font-size: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#f6f7f9; --panel:#fff; --panel-2:#fbfaff; --border:#e3e6ec;
        --text:#1a1d23; --muted:#5b6472;
      }
      .composer button { color:#fff; }
      .avatar { background:#f0f3fb; }
      .btext.md strong { color:#000; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏢 AI 부서 회의</h1>
    <p>주제를 던지면 기획·마케팅·개발·디자인·재무 AI가 회의하고 결과물을 만들어냅니다.</p>
  </header>

  <div class="wrap">
    <div class="composer">
      <input id="topic" type="text" autocomplete="off"
             placeholder="예: 20대 겨냥한 구독형 도시락 서비스를 만들고 싶어" />
      <button id="start">회의 시작</button>
    </div>
    <div class="chips" id="chips">
      <span class="chip">신규 모바일 앱 런칭 전략</span>
      <span class="chip">사내 복지 제도 개편안</span>
      <span class="chip">AI 챗봇 고객상담 도입</span>
    </div>
    <div class="hint" id="hint">주제를 입력하고 <b>회의 시작</b>을 누르세요.</div>

    <div id="meeting"></div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const topicEl = $("#topic");
    const startBtn = $("#start");
    const meetingEl = $("#meeting");
    const hintEl = $("#hint");

    let es = null;          // EventSource
    let currentText = null; // 현재 발언 중인 .btext 요소
    let running = false;

    document.querySelectorAll(".chip").forEach((c) =>
      c.addEventListener("click", () => { topicEl.value = c.textContent; topicEl.focus(); })
    );

    startBtn.addEventListener("click", start);
    topicEl.addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

    function start() {
      if (running) return;
      const topic = topicEl.value.trim();
      if (!topic) { topicEl.focus(); return; }

      running = true;
      startBtn.disabled = true;
      startBtn.textContent = "회의 중…";
      hintEl.style.display = "none";
      meetingEl.innerHTML = "";
      currentText = null;

      es = new EventSource("/api/meeting?topic=" + encodeURIComponent(topic));
      es.onmessage = (e) => handle(JSON.parse(e.data));
      es.onerror = () => { if (running) finish("연결이 끊어졌어요. 다시 시도해주세요."); };
    }

    function handle(ev) {
      switch (ev.type) {
        case "phase": addPhase(ev.name); break;
        case "agent_start": addBubble(ev); break;
        case "token": appendToken(ev.text); break;
        case "agent_end": endBubble(); break;
        case "done": finish(null); break;
        case "error": showError(ev.message); finish(null); break;
      }
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function addPhase(name) {
      const d = document.createElement("div");
      d.className = "phase";
      d.textContent = name;
      meetingEl.appendChild(d);
    }

    function addBubble(ev) {
      const isFinal = ev.role === "최종 결과물";
      const wrap = document.createElement("div");
      wrap.className = "bubble" + (isFinal ? " final" : "");
      wrap.innerHTML = `
        <div class="bhead">
          <div class="avatar">${ev.icon || "💬"}</div>
          <span class="bname">${escapeHtml(ev.speaker)}</span>
          <span class="brole">${escapeHtml(ev.role)}</span>
        </div>
        <div class="btext cursor${isFinal ? " md" : ""}"></div>`;
      meetingEl.appendChild(wrap);
      currentText = wrap.querySelector(".btext");
      currentText._final = isFinal;
      currentText._raw = "";
    }

    function appendToken(text) {
      if (!currentText) return;
      currentText._raw += text;
      if (currentText._final) currentText.innerHTML = renderMarkdown(currentText._raw);
      else currentText.textContent = currentText._raw;
    }

    function endBubble() {
      if (currentText) currentText.classList.remove("cursor");
      currentText = null;
    }

    function finish(message) {
      running = false;
      if (es) { es.close(); es = null; }
      endBubble();
      startBtn.disabled = false;
      startBtn.textContent = "회의 시작";
      if (message) showError(message);
      else addStatus("✅ 회의가 종료되었습니다.");
    }

    function addStatus(t) {
      const d = document.createElement("div");
      d.className = "status"; d.textContent = t;
      meetingEl.appendChild(d);
    }
    function showError(msg) {
      const d = document.createElement("div");
      d.className = "error"; d.textContent = "⚠️ " + msg;
      meetingEl.appendChild(d);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    // 아주 가벼운 마크다운 렌더러 (## 제목, **굵게**, - 목록)
    function renderMarkdown(src) {
      const lines = escapeHtml(src).split("\n");
      let html = "", inList = false;
      for (let line of lines) {
        if (/^##\s+/.test(line)) {
          if (inList) { html += "</ul>"; inList = false; }
          html += "<h2>" + line.replace(/^##\s+/, "") + "</h2>";
        } else if (/^\s*[-*]\s+/.test(line)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(line.replace(/^\s*[-*]\s+/, "")) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += line.trim() ? "<div>" + inline(line) + "</div>" : "<br>";
        }
      }
      if (inList) html += "</ul>";
      return html;
    }
    function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  </script>
</body>
</html>
